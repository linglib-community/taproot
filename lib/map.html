<header><a href="#" id="brand">Taproot</a><span id="crumb"></span><span id="note"></span><div id="search"><input id="go" placeholder="/  file or directory" autocomplete="off"><div id="hits" hidden></div></div><small id="meta"></small></header>

<script>
const F=__FILES__, I=__IMP__, R=__REST__, RANK=__RANK__, META=__META__, BASE=__BASE__, SRC=__SRC__, GROUPS=__GROUPS__, TT=__TITLES__;
const THEORY=new Set(['Semantics','Syntax','Pragmatics','Morphology','Phonology','Processing','Discourse','Logic']), TOP1=new Set(['Core','Data','Studies']);
const $=s=>document.querySelector(s), view=$('#view'), statusEl=$('#status'), go=$('#go'), hits=$('#hits');

const ix={}; F.forEach((f,i)=>ix[f]=i); const rev=F.map(()=>[]); I.forEach((a,i)=>a.forEach(j=>rev[j].push(i)));

const graph=(F,I)=>{const ix={},rev=F.map(()=>[]),memo={};F.forEach((f,i)=>ix[f]=i);I.forEach((a,i)=>a.forEach(j=>rev[j].push(i)));
  return {F,I,ix,cone(i){if(memo[i])return memo[i];const s=new Set(),st=[i];while(st.length){const x=st.pop();for(const j of I[x])if(!s.has(j)){s.add(j);st.push(j)}}return memo[i]=s},
    above(seed){const s=new Set(),st=[...seed];while(st.length){const x=st.pop();for(const j of rev[x])if(!s.has(j)){s.add(j);st.push(j)}}return s}}};
const HEAD={F,I,ix,cone,above}, OLD=BASE?graph(BASE.files,BASE.imp):null, DD=new Map();

const OPEN=new Set(); let STEP=()=>{},HOLDF=()=>{},RELF=()=>{};

function crumb(kind,name){const p=name.split('.'),up=d=>'#m/'+d;$('#crumb').innerHTML=p.map((seg,k)=>{const d=p.slice(0,k+1).join('.'),last=k===p.length-1;return last?`<b>${esc(seg)}</b>`:dirs.has(d)?`<a href="${up(d)}">${esc(seg)}</a>`:esc(seg)}).join(' › ')}

function recent(){if(!BASE)return '';const hk=new Map(RANK.map(r=>[r[2]+'|'+F[r[4]],r])),bk=new Map(BASE.rank.map(r=>[r[2]+'|'+r[4],r])),ch=[];
  for(const k of new Set([...hk.keys(),...bk.keys()])){const a=bk.get(k),z=hk.get(k);if(a&&z&&a[0]===z[0])continue;const [d,t]=k.split('|'),B=dirData(OLD,d),H=dirData(HEAD,d),b=B&&B.pick(t)?B.pick(t).n:0,n=H&&H.pick(t)?H.pick(t).n:0;

  const H=y+8,GW=L0+colW*(maxH+1)+40,how=z=>z===x0?'this file':!R[z]?'not measured':x0 in R[z].n?`names it: ${pl(R[z].n[x0],'declaration')} there`:x0 in R[z].c?`has it carried through ${(R[z].c[x0][1]||R[z].c[x0][0])[0]}`:R[z].p.includes(x0)?'uses it only inside proofs':'only reaches it through imports';
  for(const z of all){const p=pos[z],rd=z===x0?7:4.5;bx+=`<div class="dot td ${cls(z)}" data-i="${z}" data-pin="${esc(F[z])}" data-open="#f/${F[z]}" data-name="${esc(F[z])}" data-full="${esc(F[z])}${TT[z]?' — '+esc(TT[z]):''}${z===x0?'':' · '+ht(z)+' steps above this file · '+esc(how(z))}" style="left:${(p[0]-rd).toFixed(1)}px;top:${(p[1]-rd).toFixed(1)}px;width:${2*rd}px;height:${2*rd}px"></div>`}
  const cnt={named:0,car:0,pf:0,un:0,plain:0};U.forEach(z=>cnt[cls(z)]++);const layer={theory:0,Languages:0,Studies:0,other:0};U.forEach(z=>{const t=F[z].split('.')[0];layer[THEORY.has(t)?'theory':t==='Languages'||t==='Studies'?t:'other']++});
  const mkrow=(k,n,txt)=>`<div class="fl"><i class="dot td ${k}" style="position:static;width:9px;height:9px;flex:none"></i><b class="num">${n}</b> ${txt}</div>`;
  let side=`<div class="fn2">${esc(f.split('.').slice(-2).join('.'))}</div>${TT[x0]?`<div class="ttl">${esc(TT[x0])}</div>`:''}<div class="dim">${pl(U.size,'file')} rest on it · ${layer.theory} in the theory areas, ${layer.Languages} language files, ${layer.Studies} studies${layer.other?', '+layer.other+' other':''}</div><div class="updn"><a href="#f/${f}">↓ what it rests on</a><b>↑ what rests on it</b></div><div id="tsel"></div><h2>how they depend on it</h2>`+mkrow('named',cnt.named,'name something in it')+mkrow('car',cnt.car,'have it carried to them, naming nothing in it')+mkrow('un',cnt.un,'only reach it through imports')+(cnt.pf?mkrow('pf',cnt.pf,'use it only inside proofs'):'')+(cnt.plain?mkrow('plain',cnt.plain,'not measured'):'');
  view.innerHTML=`<div class="tv"><div class="tmain"><div id="tend" style="width:${GW}px;height:${H}px"><svg width="${GW}" height="${H}">${sv}<g id="tw2"></g></svg>${bx}</div></div><aside class="tside">${side}</aside></div>`;
  const td=$('#tend'),tw2=td.querySelector('#tw2'),sel=$('#tsel');let held=null;
  const show=z=>{const btw=new Set(all.filter(w=>w===z||w===x0||(inU(w)&&cone(z).has(w)&&w!==z)));td.classList.add('focus');td.querySelectorAll('.dot').forEach(el=>el.classList.toggle('lit',btw.has(+el.dataset.i)));let e='';
    for(const w of btw)for(const j of I[w])if(btw.has(j)&&!I[w].some(k=>k!==j&&btw.has(k)&&cone(k).has(j))){const a=pos[j],b=pos[w],mx=(a[0]+b[0])/2;e+=`<path class="te on" d="M${a[0]},${a[1]} C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}"/>`}tw2.innerHTML=e;
    td.querySelectorAll('.pl.tmp').forEach(e2=>e2.remove());if(z!==x0)td.insertAdjacentHTML('beforeend',`<span class="pl tmp" style="left:${(pos[z][0]+9).toFixed(1)}px;top:${(pos[z][1]-10).toFixed(1)}px">${esc(F[z].split('.').slice(-2).join('.'))}${TT[z]?`<span class="tt">${esc(TT[z])}</span>`:''}</span>`)};
  const clear=()=>{td.classList.remove('focus');td.querySelectorAll('.lit,.held').forEach(e=>e.classList.remove('lit','held'));tw2.innerHTML='';td.querySelectorAll('.pl.tmp,.pl.tmp2').forEach(e=>e.remove())};
  const selHtml=z=>{let h=`<div class="selbox"><div class="m">${nm(F[z])}</div>${TT[z]?`<div class="ttl">${esc(TT[z])}</div>`:''}<div class="dim sm">${ht(z)} steps above this file</div><div class="sm">${esc(how(z))}</div>`;
    if(R[z]&&x0 in R[z].c)h+=`<div class="chain">`+R[z].c[x0].map((st,i)=>`<div class="st"><span class="k">${i+1}</span><span class="d">${esc(st[0])}</span><span class="w">${i===0?'that file':st[1]>=0?esc(laneOf(F[st[1]])+' · '+leafOf(F[st[1]])):''}</span></div>`).join('')+`</div>`;
    return h+`<a class="go" href="#f/${F[z]}">its own descent →</a></div>`};
  HOLDF=el=>{const z=+el.dataset.i;clear();held=z;show(z);el.classList.add('held');sel.innerHTML=z===x0?'':selHtml(z)};RELF=()=>{if(held!==null){held=null;clear();sel.innerHTML=''}};
  td.querySelectorAll('.dot').forEach(el=>{const z=+el.dataset.i;el.onmouseenter=()=>{if(held===null)show(z)};el.onmouseleave=()=>{if(held===null)clear()}})}

function dirData(G,d){const key=(G===HEAD?'h|':'b|')+d;if(DD.has(key))return DD.get(key);const {F,I}=G,mem=[],ar=i=>F[i].split('.')[0];F.forEach((f,i)=>{if(f.startsWith(d+'.'))mem.push(i)});let D=null;
  if(mem.length){const S=new Set(mem),outside=seed=>{let n=0;for(const i of G.above(seed))if(!S.has(i))n++;return n},U=outside(mem),ext=new Map();
    for(const m of mem)for(const j of I[m])if(!S.has(j)&&THEORY.has(ar(j))&&ar(j)!==ar(m)){if(!ext.has(j))ext.set(j,[]);ext.get(j).push(m)}
    const ranked=[...ext].map(([t,es])=>({t,es,name:F[t],n:outside(es)})).sort((a,b)=>b.n-a.n||(a.name<b.name?-1:1));
    D={G,d,mem,S,U,outside,ranked,clean:U-outside([...ext.values()].flat()),down:es=>{const s=new Set(es);for(const i of G.above(es))if(S.has(i))s.add(i);return s},pick:name=>ranked.find(e=>e.name===name)}}
  DD.set(key,D);return D}
const meter=(n,U,old)=>`<i class="meter${old?' old':''}"><i style="width:${U?100*n/U:0}%"></i></i>`;

function dirPanel(D,sel,o){const {G,d,mem,S,U}=D,{F,I}=G,tint=sel?D.down(sel.es):new Set();
  const dm={},dep=n=>{if(n in dm)return dm[n];dm[n]=0;let b=0;for(const j of I[n])if(S.has(j))b=Math.max(b,dep(j)+1);return dm[n]=b};
  const rel=n=>F[n].slice(d.length+1),laneN=n=>{const p=rel(n).split('.');return p.length>1?p[0]:''},laneNames=[...new Set(mem.map(laneN))].sort();
  const gutter=laneNames.some(x=>x)?124:0,maxD=Math.max(...mem.map(dep)),colW=Math.max(132,Math.min(230,(o.W-gutter)/(maxD+1))),BW=colW-28,pos={},vq=o.vs?'?vs=1':'';
  let y=2,bx='';
  for(const L of laneNames){const ms=mem.filter(n=>laneN(n)===L).sort((a,b)=>F[a]<F[b]?-1:1);
    if(L&&sel&&laneNames.length>1&&!ms.some(n=>tint.has(n)||o.from.has(F[n]))){bx+=`<a class="fold" style="top:${y}px" href="#d/${d}.${L}${vq}" data-full="${esc(d+'.'+L)} · ${ms.length} files, none downstream of the selected file"><b>${esc(L)}</b> · ${pl(ms.length,'file')} · not downstream</a>`;y+=32;continue}
    if(L)bx+=`<a class="ll" style="top:${y+3}px" href="#d/${d}.${L}${vq}">${esc(mid(L,17))}</a>`;const colY={};let hm=0;
    for(const n of ms){const k=dep(n),e=!!sel&&sel.es.includes(n),h=e?40:24,yy=colY[k]||0,u=D.outside([n]);pos[n]=[gutter+k*colW,y+yy,h];colY[k]=yy+h+5;hm=Math.max(hm,colY[k]);
      const nmL=L?rel(n).slice(L.length+1):rel(n),inHead=F[n] in ix,why=!o.base&&sel&&R[n]&&R[n].c[sel.t]?{why:sel.name}:{},diff=o.other&&!(F[n] in o.other.ix)?(o.base?' gone':' new'):'';
      bx+=`<div class="bx${tint.has(n)?' tint':''}${e?' entry':''}${o.from.has(F[n])?' hl':''}${diff}" style="left:${pos[n][0]}px;top:${pos[n][1]}px;width:${BW}px;height:${h}px" data-f="${n}" data-name="${esc(F[n])}"${inHead?` data-open="${addr('f/'+F[n],why)}"`:''} data-full="${esc(F[n])} · ${u} of ${U} users reach it${e?' · imports '+esc(sel.name):tint.has(n)?' · downstream of '+esc(sel.name):''}${diff===' gone'?' · not in the branch':diff===' new'?' · new in the branch':''}"><span class="nm">${nm(nmL)}</span><span class="rt">${u}</span>${e?`<span class="in">← ${esc(mid(sel.name,Math.floor(BW/7)-3))}</span>`:''}<i class="bar" style="width:${U?100*u/U:0}%"></i></div>`}
    y+=hm+12}
  let sv='';for(const n of mem){if(!pos[n])continue;for(const j of I[n]){if(!pos[j]||I[n].some(k=>k!==j&&S.has(k)&&G.cone(k).has(j)))continue;const a=pos[j],b=pos[n],x1=a[0]+BW,y1=a[1]+a[2]/2,x2=b[0],y2=b[1]+b[2]/2,mx=(x1+x2)/2;
    sv+=`<path class="e${dep(n)-dep(j)>1?' long':''}" data-a="${j}" data-b="${n}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`}}
  const GW=gutter+(maxD+1)*colW;
  return `<div style="overflow-x:auto"><div class="dg" style="width:${GW}px;height:${y+6}px"><svg class="dwires" width="${GW}" height="${y+6}">${sv}</svg>${bx}</div></div>`}

function dirView(d,q){crumb('d',d);const H=dirData(HEAD,d),vs=!!(q.vs&&OLD),B=vs?dirData(OLD,d):null;if(!H&&!B){view.innerHTML='<p class="dim">no such directory in this tree</p>';return}
  const val=(D,name)=>{const e=D&&D.pick(name);return e?e.n:0},names=[...new Set([...(H?H.ranked:[]),...(B?B.ranked:[])].map(e=>e.name))],hU=H?H.U:0,bU=B?B.U:0;
  const list=names.map(name=>({name,h:val(H,name),b:val(B,name)})).sort((x,y)=>(vs?Math.abs(y.h-y.b)-Math.abs(x.h-x.b):0)||y.h-x.h||(x.name<y.name?-1:1));
  const cur=list.find(e=>e.name===q.enter)||list[0],i0=list.indexOf(cur);
  STEP=k=>{if(list.length)location.hash=addr('d/'+d,{enter:list[(i0+k+list.length)%list.length].name,vs:q.vs,from:q.from})};
  const from=new Set();if(q.from&&ix[q.from]!==undefined){from.add(q.from);for(const i of cone(ix[q.from]))from.add(F[i])}
  const W=Math.max(520,view.clientWidth-390),tog=OLD?`<a data-vs="1">${vs?'after only':'before and after'}</a>`:'';
  const strip=(D,label)=>`<div class="strip">${label?`<span class="tag">${label}</span>`:''}`+(D?`<b class="num">${D.mem.length}</b> files · <b class="num">${D.U}</b> files outside use it · <b class="num">${D.clean}</b> of them take on nothing from another theory area`:'this directory does not exist there')+`</div>`;
  let h=`<div class="dv"><div class="dmain">`;
  h+=cur?`<div class="enter"><span class="dim">enters</span><span class="m">${esc(cur.name)}</span>`+(vs?`<span class="num">${cur.b} of ${bU}</span>${meter(cur.b,bU,1)}<span class="dim">→</span>`:'')+`<span class="num">${cur.h} of ${hU} users</span>${meter(cur.h,hU)}<span class="dim"><a data-step="-1">‹</a>${i0+1} of ${list.length}<a data-step="1">›</a></span>${tog}</div>`:`<div class="enter dim">no file here imports another theory area ${tog}</div>`;
  if(vs){h+=strip(B,'before · '+esc(BASE.label));if(B)h+=dirPanel(B,B.pick(cur&&cur.name),{from,W,other:HEAD,base:true,vs});h+=`<div style="height:16px"></div>`+strip(H,'after')}else h+=strip(H,'');
  if(H)h+=dirPanel(H,H.pick(cur&&cur.name),{from,W,other:vs?OLD:null,base:false,vs});
  h+=`</div><aside class="dside"><div class="ch">${vs?'from other theory areas · users inheriting, before → after':`from other theory areas ${list.length} · users inheriting each`}</div>`+list.map(e=>`<div class="er${e===cur?' sel':''}${vs?' two':''}" data-enter="${esc(e.name)}" data-full="${esc(e.name)}${vs?` · ${e.b} of ${bU} before, ${e.h} of ${hU} after`:''}"><span class="nm">${nm(e.name)}</span><span class="rt">${vs?e.b+' → ':''}${e.h}</span>${vs?`<span class="mm">${meter(e.b,bU,1)}${meter(e.h,hU)}</span>`:meter(e.h,hU)}</div>`).join('')+`</aside></div>`;
  view.innerHTML=h;
  const panels=[...view.querySelectorAll('.dg')],Ds=[vs?B:null,H].filter(Boolean);
  panels.forEach(el=>el.querySelectorAll('.bx').forEach(b=>{b.onmouseenter=()=>el.querySelectorAll(`path.e[data-a="${b.dataset.f}"],path.e[data-b="${b.dataset.f}"]`).forEach(p=>p.classList.add('on'));b.onmouseleave=()=>el.querySelectorAll('path.e.on').forEach(p=>p.classList.remove('on'))}));
  view.querySelectorAll('.er').forEach(er=>{er.onmouseenter=()=>panels.forEach((el,k)=>{const e=Ds[k].pick(er.dataset.enter),s=e?Ds[k].down(e.es):new Set();el.querySelectorAll('.bx').forEach(b=>b.classList.toggle('pv',s.has(+b.dataset.f)))});er.onmouseleave=()=>view.querySelectorAll('.bx.pv').forEach(b=>b.classList.remove('pv'))})}

function route(){const {path,q}=parse();if(q.theme)document.documentElement.dataset.theme=q.theme;$('#note').textContent=q.note||'';statusEl.textContent=HINT;
  if(path.startsWith('d/'))dirView(path.slice(2),q);else if(path.startsWith('f/'))fileView(path.slice(2),q);else mapView(path.startsWith('m/')?path.slice(2):'',q);
  const hl=new Set((q.hl||'').split(',').filter(Boolean));let first=null;if(hl.size)view.querySelectorAll('[data-name]').forEach(el=>{if(hl.has(el.dataset.name)){el.classList.add('hl');first=first||el}});
  const tgt=first||view.querySelector('.row.sel');if(tgt)tgt.scrollIntoView({block:'nearest'})}
function setCur(el){view.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));if(el){el.classList.add('cur');el.scrollIntoView({block:'nearest'});if(el.dataset.full)statusEl.textContent=el.dataset.full}}
view.addEventListener('click',e=>{const {path,q}=parse(),t=e.target.closest('[data-go],[data-holdx],[data-step],[data-vs],[data-pin],[data-toggle],[data-why],[data-enter],[data-open]');if(!t||(t.classList.contains('il')&&!t.dataset.pin)){RELF();if(!t)return}
  if(t.dataset.go)location.hash=t.dataset.go;
  else if(t.dataset.holdx){const d=view.querySelector(`.dot[data-i="${t.dataset.holdx}"]`);if(d){HOLDF(d);d.scrollIntoView({block:'nearest',inline:'nearest'})}}
  else if(t.dataset.step)STEP(+t.dataset.step);
  else if(t.dataset.vs)location.hash=addr(path,{...q,vs:q.vs?'':'1'});
  else if(t.dataset.pin)HOLDF(t);
  else if(t.dataset.toggle){const k=t.dataset.toggle;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);route()}
  else if(t.dataset.why)location.hash=addr(path,{why:q.why===t.dataset.why?'':t.dataset.why});
  else if(t.dataset.enter)location.hash=addr(path,{enter:t.dataset.enter,from:q.from,vs:q.vs});
  else if(t.tagName!=='A')setCur(t)});
view.addEventListener('dblclick',e=>{const t=e.target.closest('[data-open]');if(t)location.hash=t.dataset.open});
view.addEventListener('mouseover',e=>{const t=e.target.closest('[data-full]');statusEl.textContent=t?t.dataset.full:HINT});
function find(s){s=s.toLowerCase();const out=[],sc=n=>{const l=n.toLowerCase(),last=l.slice(l.lastIndexOf('.')+1);return last===s?0:last.startsWith(s)?1:last.includes(s)?2:l.includes(s)?3:9};
  for(const d of DIRS){const k=sc(d);if(k<9)out.push([k,d.length,'m/'+d])}F.forEach((f,i)=>{let k=sc(f);if(k===9&&s.length>2&&TT[i]&&TT[i].toLowerCase().includes(s))k=4;if(k<9)out.push([k,f.length,'f/'+f,TT[i]])});return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,12)}
go.addEventListener('input',()=>{const s=go.value.trim();if(!s){hits.hidden=true;return}const r=find(s);hits.innerHTML=r.map((x,i)=>`<a href="#${x[2]}" class="${i?'':'first'}"><span class="dim">${x[2][0]==='m'?'dir ':'file'}</span> ${esc(x[2].slice(2))}${x[3]?`<span class="tt">${esc(x[3])}</span>`:''}</a>`).join('')||'<a class="dim">no match</a>';hits.hidden=false});
go.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=hits.querySelector('a[href]');if(a)location.hash=a.getAttribute('href')}if(e.key==='Enter'||e.key==='Escape'){go.value='';hits.hidden=true;go.blur()}});
hits.addEventListener('click',()=>{go.value='';hits.hidden=true});
addEventListener('keydown',e=>{if(e.target===go||e.metaKey||e.ctrlKey||e.altKey)return;const {path,q}=parse();
  if(e.key==='b'&&OLD&&path.startsWith('d/'))location.hash=addr(path,{...q,vs:q.vs?'':'1'});
  else if(e.key==='/'){e.preventDefault();go.focus()}
  else if(e.key==='u'){const p=path.slice(2).split('.');p.pop();const d=p.join('.');location.hash=!path||!d?'':'m/'+d}
  else if(e.key==='j'||e.key==='k'){const rs=[...view.querySelectorAll('.row[data-open],.bx,.hr')],i=rs.indexOf(view.querySelector('.cur'));if(rs.length)setCur(rs[Math.max(0,Math.min(rs.length-1,i+(e.key==='j'?1:-1)))])}
  else if(e.key==='Enter'){const c=view.querySelector('.cur');if(c)c.dataset.why&&!c.classList.contains('sel')?c.click():location.hash=c.dataset.open||c.getAttribute('href')}
  else if(e.key===']'||e.key==='[')STEP(e.key===']'?1:-1);
  else if(e.key==='Escape'){RELF();location.hash=path}});
let RZ=0;addEventListener('hashchange',route);addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(route,200)});route();
</script>
